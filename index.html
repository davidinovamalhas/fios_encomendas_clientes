<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão Fios Encomendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior fixa + área de trabalho larga; tabelas editáveis tipo folha de cálculo, resultados em cartões e tabelas */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#F5F7F9; --ink:#14202B; --muted:#5A6978;
  --line:#D5DCE3; --line2:#E7ECF0; --accent:#0B6E7C; --accent-ink:#FFFFFF; --accent-soft:#DAEFF2;
  --ok:#1B7A4B; --ok-soft:#DBF1E5; --warn:#8F5B00; --warn-soft:#FBEBC9; --bad:#B3261E; --bad-soft:#FBE1DE;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 4px 14px rgba(20,32,43,.05);
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Archivo','IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1318; --surface:#161D24; --surface2:#1B242C; --ink:#E5EBF0; --muted:#93A1AE;
  --line:#2A353F; --line2:#222C35; --accent:#4DB4C3; --accent-ink:#06242A; --accent-soft:#12323A;
  --ok:#52C28A; --ok-soft:#12301F; --warn:#E3A93B; --warn-soft:#38290B; --bad:#FF8A80; --bad-soft:#3E1714;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#161D24; --surface2:#1B242C; --ink:#E5EBF0; --muted:#93A1AE;
  --line:#2A353F; --line2:#222C35; --accent:#4DB4C3; --accent-ink:#06242A; --accent-soft:#12323A;
  --ok:#52C28A; --ok-soft:#12301F; --warn:#E3A93B; --warn-soft:#38290B; --bad:#FF8A80; --bad-soft:#3E1714;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:2600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* barra */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-head);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;margin-right:4px}
.brand small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:7px 12px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;font-size:13.5px}
nav a:hover{background:var(--surface2);color:var(--ink)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
#logout{margin-left:auto}#logout:not([hidden])+.status{margin-left:0}
.status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.p{background:var(--warn)}.dot.e{background:var(--bad)}
main{padding-block:20px 60px}
h1{font-family:var(--f-head);font-size:24px;line-height:1.15;margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font-family:var(--f-head);font-size:16px;margin:0;letter-spacing:-.005em}
h3{font-size:12px;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead .sp{flex:1}
.sub{color:var(--muted);margin-top:4px}
/* botões */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,tr[data-go]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;width:26px;height:26px;border-radius:5px;font-size:16px;line-height:1}
.x:hover{background:var(--bad-soft);color:var(--bad)}
/* cartões */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line2)}
.card>.hd .sp{flex:1}
.card>.bd{padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:400}
.kpi .n{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}
/* filtros */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:0}
.filters input[type=search]{flex:1 1 200px;max-width:320px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
/* tabelas */
.tw{overflow:visible}
.tw table{table-layout:auto;width:100%}
.tw td,.tw th{min-width:0}
.tw input.cell,.tw select.cell,.tw textarea.cell{width:100%;min-width:0}
@media (max-width:1300px){th{padding:6px 5px;font-size:10.5px;letter-spacing:.02em}td{padding:5px 5px;font-size:12.5px}.cell{padding:5px 4px}}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:normal;background:var(--surface2)}
td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right}th.r{text-align:right}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl tbody tr[data-go]{cursor:pointer}
.tbl tbody tr[data-go]:hover td{background:var(--surface2)}
.tbl .grp td{background:var(--surface2);font-weight:600;border-top:1px solid var(--line)}
.tbl .tot td{font-weight:600;background:var(--surface2);border-top:1px solid var(--line)}
.enc{font-family:var(--f-mono);font-weight:500;white-space:normal;overflow-wrap:anywhere}
.enc a{white-space:nowrap}
.refc{white-space:nowrap;overflow-wrap:normal}
@media (max-width:1100px){.tbl th,.tbl td{padding:5px 3px;font-size:11.5px}.tbl .num{font-size:11.5px}.pill{font-size:10.5px;padding:2px 5px}.bar{min-width:24px}}
@media (max-width:760px){.tbl,.tbl tbody,.tbl tr,.tbl td{font-size:10.5px}.tbl th,.tbl td{padding:4px 2px}}
.enc a{color:var(--accent);text-decoration:none}
.trunc{white-space:normal;overflow-wrap:anywhere}
.bar{display:block;height:4px;border-radius:2px;background:var(--line2);margin-top:4px;min-width:40px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.full{background:var(--ok)}.bar i.over{background:var(--warn)}
.tone-ok{color:var(--ok)}.tone-warn{color:var(--warn)}.tone-bad{color:var(--bad)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:normal}
.pill.a{background:var(--accent-soft);color:var(--accent)}
.pill.f{background:var(--line2);color:var(--muted)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.b{background:var(--bad-soft);color:var(--bad)}
.pill.o{background:var(--ok-soft);color:var(--ok)}
.prov{font-size:10.5px;color:var(--muted);font-family:var(--f-body);margin-left:4px}
/* células editáveis */
.cell{width:100%;min-width:0;border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:5px}
.cell:hover{border-color:var(--line)}
.cell:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.cell.n{text-align:right;font-family:var(--f-mono)}
select.cell{padding-right:2px;cursor:pointer}
.ed td{padding:2px 4px}
.ed th{padding:6px 8px}
.ed tr.dev td{background:var(--warn-soft)}
.ed tr.dev .cell:focus{background:var(--surface)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.fld .cell{border-color:var(--line);background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.grid .w2{grid-column:span 2}
.art{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.art+.art{margin-top:12px}
.art .ah{display:grid;grid-template-columns:minmax(200px,1fr) 120px 120px auto;gap:10px;align-items:end;padding:12px;background:var(--surface2);border-bottom:1px solid var(--line)}
.sumchip{font-size:12px;font-weight:600}
.warns{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:7px 11px;font-size:13px}
.warn.b{background:var(--bad-soft);color:var(--bad)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}
.empty .row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
details.how{margin-top:4px;font-size:13px;color:var(--muted)}
details.how summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.how p{margin:8px 0 0;max-width:80ch}
.two{display:grid;grid-template-columns:1fr;gap:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;display:flex;gap:14px;align-items:center;z-index:40;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}
.toast button{background:transparent;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600}
.back{display:inline-flex;gap:6px;color:var(--muted);text-decoration:none;font-size:13px;margin-bottom:8px}
.back:hover{color:var(--accent)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:720px){
  .art .ah{grid-template-columns:1fr 1fr}.art .ah .fld:first-child{grid-column:1/-1}
  .grid .w2{grid-column:auto}
  h1{font-size:20px}
  .status{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
[hidden]{display:none!important}
.login{max-width:380px;margin:60px auto}
.login form{display:flex;flex-direction:column;gap:12px}
.login .err{color:var(--bad);font-size:13px;min-height:18px}
/* impressão: só o conteúdo de #printarea é impresso */
#printarea{display:none}
@page{size:A4 portrait;margin:10mm}
@page doc{size:A4 portrait;margin:10mm}
@page label{size:A5 portrait;margin:10mm}
@media print{
  body.printing{background:#fff;color:#000;font-size:11px}
  body.printing::before{display:none}
  body.printing>*:not(#printarea){display:none!important}
  body.printing #printarea{display:block!important}
  .print-doc{font-family:Arial,Helvetica,sans-serif;color:#000}
  .print-doc h1{font-size:18pt;margin:0 0 2px}
  .print-doc .psub{font-size:9pt;color:#444;margin-bottom:8px}
  .print-doc h2{font-size:11.5pt;margin:14px 0 4px;break-after:avoid}
  table.pt{width:100%;max-width:100%;table-layout:auto;border-collapse:collapse;font-size:8pt}
  body.printing,body.printing html{width:auto;overflow:visible}
  .pt{page-break-inside:auto}.pt thead{display:table-header-group}
  .print-doc{width:100%;max-width:100%;overflow:visible;page:doc}
  .print-label{page:label}
  .pt th,.pt td{border:1px solid #888;padding:3px 5px;text-align:left;vertical-align:top;white-space:normal;overflow-wrap:anywhere;word-break:break-word;background:#fff;color:#000;font-size:8pt;text-transform:none;letter-spacing:0}
  .pt th{background:#e8e8e8;font-weight:700}
  .pt .r{text-align:right}
  .pt tr{break-inside:avoid}
  .pw{font-size:8.5pt;margin:2px 0}
  .lbl{height:186mm;border:3px solid #000;padding:8mm;display:flex;flex-direction:column;gap:4mm;break-after:page;page-break-after:always;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#000;box-sizing:border-box}
  .lbl:last-child{break-after:auto;page-break-after:auto}
  .lbl .tt{font-size:13pt;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-bottom:3px solid #000;padding-bottom:3mm}
  .lbl .k{font-size:10pt;text-transform:uppercase;letter-spacing:.08em;color:#444}
  .lbl .big{font-size:24pt;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
  .lbl .mid{font-size:16pt;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
  .lbl .kg{font-size:46pt;font-weight:700;line-height:1}
  .lbl .row{border-bottom:1px solid #999;padding-bottom:2mm}
  .lbl .two{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
  .lbl .fill{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:6mm;font-size:12pt}
  .lbl .fill div{border-bottom:2px solid #000;padding-top:10mm}
}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<body>
<header class="top"><div class="wrap">
  <div class="brand">Gestão Fios Encomendas <small>fio de clientes · malha</small></div>
  <nav id="nav" aria-label="Secções">
    <a href="#encomendas" data-v="list">Encomendas</a>
    <a href="#stock" data-v="stock">Stock de fios</a>
    <a href="#quebras" data-v="quebras">Quebras</a>
    <a href="#dados" data-v="dados">Dados e cálculos</a>
  </nav>
  <button class="btn sm" type="button" id="logout" hidden>Terminar sessão</button>
  <div class="status" id="status" aria-live="polite"><span class="dot p"></span><span>A carregar…</span></div>
</div></header>
<main class="wrap"><div id="view"><div class="loading">A carregar encomendas…</div></div></main>
<div id="toast" hidden></div>
<div id="printarea" aria-hidden="true"></div>

<script>
(function(){
'use strict';
/* ============ utilitários ============ */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'x'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;const n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const nf=(v,a,b)=>Number(v).toLocaleString('pt-PT',{minimumFractionDigits:a,maximumFractionDigits:b});
const fkg=v=>(v==null||!isFinite(v))?'—':nf(Math.abs(v)<0.005?0:v,0,2);
const fpct=v=>(v==null||!isFinite(v))?'—':nf(Math.abs(v)<0.005?0:v,2,2)+' %';
const fpp=v=>(v==null||!isFinite(v))?'—':(v>0.005?'+':'')+nf(Math.abs(v)<0.005?0:v,2,2)+' pp';
const key=s=>String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' ');
const fdate=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]:(s||'')};
const coll=(a,b)=>String(a).localeCompare(String(b),'pt',{numeric:true,sensitivity:'base'});
const inputNum=v=>(v==null||v==='')?'':String(v).replace('.',',');

/* ============ cálculos ============ */
function calc(o){
  const arts=o.artigos||[],ent=o.entradas||[],mal=o.malha||[],warn=[];
  const A=arts.map(a=>({id:a.id,nome:a.nome||'(sem nome)',qtd:num(a.qtd),qprev:num(a.qprev),malha:0,
    fios:(a.fios||[]).filter(f=>key(f.fio)).map(f=>({fio:String(f.fio).trim(),k:key(f.fio),pct:num(f.pct),usado:0,perda:0})),
    nFiosVazios:(a.fios||[]).filter(f=>!key(f.fio)).length}));
  const byId=new Map(A.map(x=>[x.id,x]));
  let malhaSem=0;
  mal.forEach(m=>{let x=byId.get(m.artigoId);if(!x&&A.length===1)x=A[0];const q=num(m.qtd);if(x)x.malha+=q;else malhaSem+=q});
  if(malhaSem>0.005)warn.push({t:'b',m:'Há '+fkg(malhaSem)+' kg de malha entregue sem artigo associado. Escolha o artigo em cada saída.'});
  const Y=new Map();
  const getY=(fio,fromComp)=>{const k=key(fio);if(!Y.has(k))Y.set(k,{k,fio:String(fio).trim(),entradas:0,devolucoes:0,usado:0,consumo:0,comp:false,qs:[],lots:new Map()});const y=Y.get(k);if(fromComp)y.comp=true;return y};
  A.forEach(x=>x.fios.forEach(f=>{const y=getY(f.fio,true);f.usado=x.malha*f.pct/100;y.usado+=f.usado;y.consumo+=f.usado*(1+x.qprev/100);y.qs.push(x.qprev)}));
  ent.forEach((e,i)=>{
    if(!key(e.fio)){if(num(e.qtd))warn.push({t:'w',m:'Um movimento de fio não tem o fio escolhido (guia '+esc(e.guia||'—')+').'});return}
    const y=getY(e.fio,false),q=num(e.qtd),dev=e.tipo==='devolucao';
    if(dev)y.devolucoes+=q;else y.entradas+=q;
    const lk=String(e.lote==null?'':e.lote).trim()||'(sem lote)';
    if(!y.lots.has(lk))y.lots.set(lk,{lote:lk,entradas:0,devolucoes:0,first:e.data||'9999',ord:i});
    const l=y.lots.get(lk);if(dev)l.devolucoes+=q;else l.entradas+=q;
    if(e.data&&e.data<l.first)l.first=e.data;
  });
  const Yr=[...Y.values()].map(y=>{
    y.liq=y.entradas-y.devolucoes;y.quebraKg=y.liq-y.usado;
    y.real=(y.usado>0&&y.liq>0)?y.quebraKg/y.liq*100:null;
    y.prev=y.usado>0?(y.consumo-y.usado)/y.usado*100:(y.qs.length?y.qs.reduce((s,v)=>s+v,0)/y.qs.length:null);
    y.stockSigned=y.liq-y.consumo;
    let rem=y.consumo;
    y.lotList=[...y.lots.values()].sort((a,b)=>(a.first<b.first?-1:a.first>b.first?1:a.ord-b.ord));
    y.lotList.forEach(l=>{l.liq=l.entradas-l.devolucoes;const t=Math.max(0,Math.min(l.liq,rem));rem-=t;l.consumo=t;l.stock=l.liq-t});
    y.falta=Math.max(0,rem);
    if(!y.comp&&(y.entradas||y.devolucoes))warn.push({t:'w',m:'O fio “'+esc(y.fio)+'” tem movimentos mas não consta da composição de nenhum artigo.'});
    if(y.falta>0.05){
      if(!y.entradas&&!y.devolucoes)warn.push({t:'w',m:'Sem entradas registadas do fio “'+esc(y.fio)+'”: a malha entregue consome '+fkg(y.consumo)+' kg. Lance a entrada para calcular a quebra deste fio.'});
      else warn.push({t:'b',m:'Fio em falta: “'+esc(y.fio)+'” — faltam '+fkg(y.falta)+' kg para cobrir a malha entregue.'});
    }
    return y});
  A.forEach(x=>{
    x.fios.forEach(f=>{const y=Y.get(f.k);f.real=y.real;f.perda=(y.real!=null&&y.usado>0)?y.quebraKg*f.usado/y.usado:0});
    x.usado=x.fios.reduce((s,f)=>s+f.usado,0);
    x.temDados=x.fios.some(f=>f.real!=null);
    x.perda=x.fios.reduce((s,f)=>s+f.perda,0);
    x.real=(x.temDados&&x.usado+x.perda>0)?x.perda/(x.usado+x.perda)*100:null;
    x.falta=Math.max(0,x.qtd-x.malha);x.entPct=x.qtd>0?x.malha/x.qtd*100:0;
    x.soma=x.fios.reduce((s,f)=>s+f.pct,0);
    if(!x.fios.length)warn.push({t:'w',m:'O artigo “'+esc(x.nome)+'” ainda não tem fios na composição.'});
    else if(Math.abs(x.soma-100)>0.05)warn.push({t:'w',m:'A composição de “'+esc(x.nome)+'” soma '+nf(x.soma,0,2)+' % (deve somar 100 %).'});
    if(x.qtd>0&&x.malha>x.qtd*1.001)warn.push({t:'w',m:'“'+esc(x.nome)+'”: malha entregue ('+fkg(x.malha)+' kg) acima da quantidade encomendada ('+fkg(x.qtd)+' kg).'});
  });
  const withData=Yr.filter(y=>y.real!=null),withUse=Yr.filter(y=>y.usado>0);
  const sL=withData.reduce((s,y)=>s+y.liq,0),sU=withData.reduce((s,y)=>s+y.usado,0);
  const sC=withUse.reduce((s,y)=>s+y.consumo,0),sU2=withUse.reduce((s,y)=>s+y.usado,0);
  const T={qtd:A.reduce((s,x)=>s+x.qtd,0),malha:A.reduce((s,x)=>s+x.malha,0)+malhaSem,
    liq:Yr.reduce((s,y)=>s+y.liq,0),entradas:Yr.reduce((s,y)=>s+y.entradas,0),devolucoes:Yr.reduce((s,y)=>s+y.devolucoes,0),
    usado:Yr.reduce((s,y)=>s+y.usado,0),consumo:Yr.reduce((s,y)=>s+y.consumo,0),
    real:sL>0?(sL-sU)/sL*100:null,quebraKg:sL-sU,prev:sU2>0?(sC-sU2)/sU2*100:null,
    stock:Yr.reduce((s,y)=>s+y.lotList.reduce((t,l)=>t+Math.max(0,l.stock),0),0),falta:Yr.reduce((s,y)=>s+y.falta,0)};
  T.faltaMalha=Math.max(0,T.qtd-T.malha);T.entPct=T.qtd>0?T.malha/T.qtd*100:0;
  T.desvio=(T.real!=null&&T.prev!=null)?T.real-T.prev:null;
  return{A,Y:Yr,T,warn};
}

async function boot(){

function applyRemote(list,initial){
  let changed=false,openChanged=false;const seen=new Set();
  list.forEach(r=>{
    if(!r||!r.id)return;seen.add(r.id);
    if(dirty.has(r.id)||timers.has(r.id))return;
    const l=S.orders.get(r.id);
    if(!l||JSON.stringify(l)!==JSON.stringify(r)){S.orders.set(r.id,normalize(clone(r)));changed=true;if(r.id===S.openId)openChanged=true}
  });
  [...S.orders.keys()].forEach(id=>{if(!seen.has(id)&&!dirty.has(id)&&!timers.has(id)&&!(Date.now()-(recent.get(id)||0)<6000)){S.orders.delete(id);changed=true;if(id===S.openId)openChanged=true}});
  if(initial){S.ready=true;return}
  if(!changed)return;
  if(S.view!=='detail')renderView();
  else if(openChanged){if(S.orders.has(S.openId))renderDetail(true);else location.hash='#encomendas'}
}
function scheduleSave(id){
  dirty.add(id);setStatus('p','A guardar…');
  clearTimeout(timers.get(id));timers.set(id,setTimeout(()=>runSave(id),450));
}
function runSave(id){
  clearTimeout(timers.get(id));timers.delete(id);
  const prev=chain.get(id)||Promise.resolve();
  const p=prev.then(async()=>{const o=S.orders.get(id);if(o)await Store.put(o);else await Store.remove(id)})
    .then(()=>{recent.set(id,Date.now());if(!timers.has(id)){dirty.delete(id);if(!dirty.size)setStatus('ok',okText())}})
    .catch(e=>{console.error(e);setStatus('err','Erro ao guardar. Verifique a ligação.')});
  chain.set(id,p);
}
function flushAll(){[...timers.keys()].forEach(runSave)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushAll()});
window.addEventListener('pagehide',flushAll);

/* ============ edição ============ */
function findTarget(o,el){
  const c=el.dataset.c,id=el.dataset.id;
  if(c==='o')return o;
  if(c==='a')return o.artigos.find(x=>x.id===id);
  if(c==='f'){const a=o.artigos.find(x=>x.id===id);return a&&a.fios[+el.dataset.i]}
  if(c==='e')return o.entradas.find(x=>x.id===id);
  if(c==='m')return o.malha.find(x=>x.id===id);
}
function onChange(el){
  const o=curOrder();if(!o||!el.dataset.c)return;
  const tg=findTarget(o,el);if(!tg)return;
  const p=el.dataset.p,t=el.dataset.t;let val=el.value;
  if(t==='n'){val=val.trim()===''?null:num(val);el.value=inputNum(val)}
  const old=tg[p];tg[p]=val;
  const c=el.dataset.c;let needMov=false;
  if(c==='f'&&p==='fio'){
    needMov=true;
    const ok=key(old);
    if(ok&&ok!==key(val)&&!o.artigos.some(a=>a.fios.some(f=>f!==tg&&key(f.fio)===ok)))o.entradas.forEach(e=>{if(key(e.fio)===ok)e.fio=String(val).trim()});
    tg.fio=String(val).trim();
  }
  if(c==='a'&&p==='nome')needMov=true;
  if(c==='e'&&p==='tipo')el.closest('tr').classList.toggle('dev',val==='devolucao');
  if(c==='o'&&(p==='cliente'))fillLists();
  afterEdit(o,needMov);
}
function afterEdit(o,mov){
  scheduleSave(o.id);renderHead();renderRes();
  o.artigos.forEach(a=>{const e=$('[data-sum="'+a.id+'"]');if(e)e.outerHTML=sumChip(a)});
  if(mov){renderMov();}
  fillLists();
}
function structural(o,focus,full){
  scheduleSave(o.id);
  if(focus)focusKey=focus;
  renderHead();renderArt();renderMov();renderRes();fillLists();
  if(focusKey){const el=$('[data-f="'+focusKey+'"]');if(el)el.focus();focusKey=null}
}
function undoable(o,msg){
  const snap=JSON.stringify(o);
  toast(msg,()=>{const r=normalize(JSON.parse(snap));S.orders.set(r.id,r);scheduleSave(r.id);if(S.view==='detail'&&S.openId===r.id)renderDetail();else renderView()});
}
function newOrder(){
  const o=normalize({id:'n'+uid().slice(1),num:'',cliente:S.f.cli||'',data:today(),ref:'',notas:'',estado:'aberta',
    artigos:[{id:uid(),nome:'',qtd:null,qprev:2,fios:[{fio:'',pct:100}]}],entradas:[],malha:[]});
  S.orders.set(o.id,o);scheduleSave(o.id);focusKey='o:'+o.id+'::num';location.hash='#enc-'+o.id;
}
function suggestLotes(o,artId){
  const a=o.artigos.find(x=>x.id===artId);if(!a)return '';
  const ks=new Set(a.fios.map(f=>key(f.fio)));const out=[];
  o.entradas.forEach(e=>{if(e.tipo!=='devolucao'&&ks.has(key(e.fio))&&e.lote&&!out.includes(e.lote))out.push(e.lote)});
  return out.join(' + ');
}
function onAdd(kind,el){
  const o=curOrder();if(!o)return;
  if(kind==='art'){const a={id:uid(),nome:'',qtd:null,qprev:2,fios:[{fio:'',pct:100}]};o.artigos.push(a);structural(o,'a:'+a.id+'::nome')}
  else if(kind==='fio'){const a=o.artigos.find(x=>x.id===el.dataset.id);if(!a)return;const rest=Math.max(0,100-a.fios.reduce((s,f)=>s+num(f.pct),0));a.fios.push({fio:'',pct:rest||null});structural(o,'f:'+a.id+':'+(a.fios.length-1)+':fio')}
  else if(kind==='ent'||kind==='dev'){
    const yn=yarnNames(o),last=o.entradas[o.entradas.length-1];
    const fio=yn.length===1?yn[0]:(last&&last.fio)||'';
    const lot=(()=>{for(let i=o.entradas.length-1;i>=0;i--){if(key(o.entradas[i].fio)===key(fio)&&o.entradas[i].lote)return o.entradas[i].lote}return ''})();
    const e={id:uid(),tipo:kind==='dev'?'devolucao':'entrada',guia:'',data:today(),fio,lote:lot,qtd:null,nota:''};o.entradas.push(e);structural(o,'e:'+e.id+'::guia')}
  else if(kind==='mal'){
    const last=o.malha[o.malha.length-1],aid=(last&&last.artigoId)||(o.artigos[0]&&o.artigos[0].id)||'';
    const m={id:uid(),guia:'',data:today(),artigoId:aid,lote:(last&&last.artigoId===aid&&last.lote)||suggestLotes(o,aid),qtd:null,nota:''};o.malha.push(m);structural(o,'m:'+m.id+'::guia')}
}
function onDel(kind,el){
  const o=curOrder();if(!o)return;const snap=JSON.stringify(o);
  if(kind==='ent')o.entradas=o.entradas.filter(x=>x.id!==el.dataset.id);
  else if(kind==='mal')o.malha=o.malha.filter(x=>x.id!==el.dataset.id);
  else if(kind==='fio'){const a=o.artigos.find(x=>x.id===el.dataset.id);if(a)a.fios.splice(+el.dataset.i,1)}
  else if(kind==='art'){o.malha.forEach(m=>{if(m.artigoId===el.dataset.id)m.artigoId=''});o.artigos=o.artigos.filter(x=>x.id!==el.dataset.id)}
  structural(o);
  toast('Linha eliminada',()=>{const r=normalize(JSON.parse(snap));S.orders.set(r.id,r);scheduleSave(r.id);renderDetail()});
}

/* ============ vista: stock de fios ============ */
function viewStock(v){
  const F=S.f;
  const rows=sortedRows(o=>(!F.scli||o.cliente===F.scli)&&(!F.sest||o.estado===F.sest));
  const lines=[];
  rows.forEach(r=>r.c.Y.forEach(y=>{
    y.lotList.forEach(l=>{if(F.sall||Math.abs(l.stock)>0.005||Math.abs(l.consumo)<0.005&&l.liq>0.005)lines.push({r,y,lote:l.lote,ent:l.entradas,dev:l.devolucoes,cons:l.consumo,stock:l.stock})});
    if(y.falta>0.05)lines.push({r,y,lote:'sem fio recebido',ent:0,dev:0,cons:y.falta,stock:-y.falta,falta:true});
  }));
  const byCli=new Map();lines.forEach(l=>{const k=l.r.o.cliente||'(sem cliente)';if(!byCli.has(k))byCli.set(k,[]);byCli.get(k).push(l)});
  const clis=[...byCli.keys()].sort(coll);
  const total=lines.reduce((s,l)=>s+Math.max(0,l.stock),0),falta=lines.reduce((s,l)=>s+(l.falta?-l.stock:0),0);
  v.innerHTML='<div class="pagehead"><div><h1>Stock de fios</h1><div class="sub">Fio que pertence aos clientes e ainda está na casa, por encomenda e lote</div></div></div>'+
  '<div class="kpis"><div class="kpi"><div class="l">Stock total (teórico)</div><div class="v">'+fkg(total)+' <small>kg</small></div></div><div class="kpi'+(falta>0.05?' bad':'')+'"><div class="l">Fio em falta</div><div class="v">'+fkg(falta)+' <small>kg</small></div><div class="n">malha entregue sem fio recebido</div></div><div class="kpi"><div class="l">Clientes com stock</div><div class="v">'+clis.length+'</div></div></div>'+
  '<div class="filters"><select id="scli" aria-label="Cliente">'+opts(allClients(),F.scli,'Todos os clientes')+'</select>'+

/* ============ vista: dados ============ */
function viewDados(v){

  '<div class="card"><div class="hd"><h2>Cópia de segurança</h2></div><div class="bd stack"><div class="muted">'+(S.mode==='supabase'?'Os dados ficam guardados no seu projeto Supabase e são partilhados por todos os dispositivos com sessão iniciada.':'Os dados ficam só neste navegador (Supabase não configurado). Faça cópias com regularidade.')+' Hoje há '+S.orders.size+' encomendas.</div>'+
  '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" type="button" data-act="export">Exportar tudo (JSON)</button><label class="btn">Importar cópia (JSON)<input type="file" accept=".json,application/json" data-act="import" hidden></label></div>'+
  '<div class="muted" style="font-size:12.5px">Ao importar, as encomendas com o mesmo identificador são substituídas pelas da cópia. As restantes não são apagadas.</div></div></div>'+
  '<div class="card"><div class="hd"><h2>Como são calculados os valores</h2></div><div class="bd stack" style="max-width:90ch">'+
  '<p style="margin:0"><b>Consumo de fio da malha</b> = malha entregue do artigo × % do fio no artigo. É o fio que a malha realmente leva.</p>'+
  '<p style="margin:0"><b>Consumo teórico</b> = consumo da malha × (1 + quebra prevista do artigo). É o fio que se espera gastar, e é o que sai do stock.</p>'+
  '<p style="margin:0"><b>Fio líquido recebido</b> = entradas de fio − devoluções de fio.</p>'+
  '<p style="margin:0"><b>Quebra real de um fio</b> = (fio líquido − consumo da malha) ÷ fio líquido. Se um fio é usado em vários artigos, o consumo soma os artigos, cada um com a sua %.</p>'+
  '<p style="margin:0"><b>Quebra prevista de um fio</b> = média das quebras previstas dos artigos que o usam, ponderada pelo fio que cada um consome.</p>'+
  '<p style="margin:0"><b>Quebra por artigo</b> = quebra real de cada fio repartida pelos artigos na proporção do fio que cada um consome. Dá a quebra do artigo em função das % de implementação.</p>'+
  '<p style="margin:0"><b>Stock por lote</b> = entradas − devoluções − consumo teórico, retirado dos lotes mais antigos primeiro.</p>'+
  '<p style="margin:0" class="muted">Numa encomenda aberta, o fio que ainda não voltou ao cliente conta como quebra, por isso o valor é provisório. Feche a encomenda depois de devolver o fio que sobrou.</p></div></div></div>';
}

/* ============ exportar / importar ============ */
function saveFile(filename,data){
  const type=filename.endsWith('.csv')?'text/csv;charset=utf-8':'application/json';
  const url=URL.createObjectURL(new Blob([data],{type}));
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Ficheiro guardado');
}
function csvCell(x){if(x==null)return '';if(typeof x==='number')return String(Math.round(x*10000)/10000).replace('.',',');const s=String(x);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
async function importFile(file){
  if(!file)return;
  try{
    const j=JSON.parse(await file.text());const list=Array.isArray(j)?j:(j.encomendas||[]);
    let n=0;list.forEach(r=>{if(r&&r.id&&Array.isArray(r.artigos)){const o=normalize(clone(r));S.orders.set(o.id,o);scheduleSave(o.id);n++}});
    toast(n?n+' encomendas importadas':'O ficheiro não tem encomendas válidas');renderView();
  }catch(e){toast('Ficheiro inválido. Use uma cópia exportada por esta app.')}
}

/* ============ devolução de fio (estado) ============ */
function devInfo(c,o){
  const T=c.T;
  if(T.entradas<=0.005)return{k:'f',l:'Sem fio',kg:0};
  const tol=Math.max(1,T.liq*0.02),sobra=T.stock;
  if(T.devolucoes<=0.005)return sobra>tol?{k:(T.entPct>=99.9?'b':'w'),l:'Não devolvido',kg:sobra}:{k:'f',l:'Sem sobras',kg:0};
  return sobra>tol?{k:'w',l:'Parcial',kg:sobra}:{k:'o',l:'Devolvido',kg:0};
}
function devPill(d){return '<span class="pill '+d.k+'"'+(d.kg>0?' title="Por devolver (teórico): '+fkg(d.kg)+' kg"':'')+'>'+esc(d.l)+(d.kg>0?' · '+fkg(d.kg)+' kg':'')+'</span>'}

/* ============ impressão ============ */
function doPrint(html,size){
  const p=$('#printarea');p.innerHTML=html;document.body.classList.add('printing');
  const st=document.createElement('style');st.id='pagestyle';
  st.textContent='@page{size:'+(size==='A5'?'A5 portrait;margin:10mm':'A4 portrait;margin:10mm')+'}';
  document.head.appendChild(st);
  const done=()=>{document.body.classList.remove('printing');p.innerHTML='';st.remove();window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),80);
}

   '<div class="row"><div class="k">Fio</div><div class="big">'+esc(e.fio||'—')+'</div></div>'+

  h+='<h2>Resumo'+(o.estado==='fechada'?'':' (quebra provisória)')+'</h2>'+pt(['Malha entregue','Malha encomendada','Fio líquido','Quebra real','Quebra prevista','Desvio','Stock fio (teórico)'],
   [[fkg(T.malha)+' kg',fkg(T.qtd)+' kg',fkg(T.liq)+' kg',fpct(T.real),fpct(T.prev),fpp(T.desvio),fkg(T.falta>0.05?-T.falta:T.stock)+' kg']],[0,1,2,3,4,5,6]);

function onPrint(kind,el){
  const o=curOrder();if(!o)return;
  if(kind==='order')doPrint(orderPrintHTML(o),'A4');
  else if(kind==='label'){const e=o.entradas.find(x=>x.id===el.dataset.id);if(e)doPrint(labelHTML(o,e),'A5')}
  else if(kind==='labels'){
    const L=o.entradas.filter(e=>e.tipo!=='devolucao');
    if(!L.length){toast('Não há entradas de fio para imprimir');return}
    doPrint(L.map(e=>labelHTML(o,e)).join(''),'A5');
  }
}

  const t=e.target;

});
root.addEventListener('click',e=>{

  if(a==='new')newOrder();
  else if(a==='del-order'){
    if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Confirmar eliminação';setTimeout(()=>{b.classList.remove('arm');b.textContent='Eliminar encomenda'},4000);return}
    const o=curOrder(),snap=JSON.stringify(o);S.orders.delete(o.id);scheduleSave(o.id);location.hash='#encomendas';
    toast('Encomenda eliminada',()=>{const r=normalize(JSON.parse(snap));S.orders.set(r.id,r);scheduleSave(r.id);renderView()});
  }
  else if(a==='export')saveFile('gestao-fios-encomendas-copia-'+today()+'.json',JSON.stringify({versao:1,exportado:new Date().toISOString(),encomendas:[...S.orders.values()]},null,1));
  else if(a==='csv'&&S.csv){const L=[S.csv.head.join(';')].concat(S.csv.rows.map(r=>r.map(csvCell).join(';')));saveFile(S.csv.name,'﻿'+L.join('\r\n'))}
});
root.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('tr[data-go]')){location.hash='#enc-'+e.target.dataset.go}
});

/* ============ arranque ============ */
boot().catch(e=>{console.error(e);S.ready=true;setStatus('err','Erro ao carregar');route()});
})();
</script>
</body>
</html>
